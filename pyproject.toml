[project]
name = "omnilabs"
version = "2.0.0-alpha.1"
description = "OmniLabs — agent observatory for Claude Code"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]
mcp = ["fastmcp>=2.0.0", "pydantic>=2.0.0"]

[project.scripts]
omnilabs = "omnilabs.cli:main"
omnilabs-mcp = "omnilabs_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omnilabs", "src/omnilabs_mcp"]

[tool.ruff]
target-version = "py311"
line-length = 100
