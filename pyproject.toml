[project]
name = "omnilabs-mcp"
version = "0.1.0"
description = "OmniLabs MCP Server — multi-perspective strategic analysis for Claude Code"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
omnilabs-mcp = "omnilabs_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omnilabs_mcp"]

[tool.ruff]
target-version = "py311"
line-length = 100
